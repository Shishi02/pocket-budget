<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<title>Pocket budget</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDE1D1;--card:#F7F0E4;--ink:#3E1921;--mut:#7a5a5f;--pri:#7F2230;--onpri:#EDE1D1;--blue:#90ADBF;--gold:#BFB065;--warn:#D9401E;--line:#d9c9b4;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#29100C;--card:#3E1921;--ink:#EDE1D1;--mut:#b99ea0;--pri:#D98A93;--onpri:#29100C;--line:#5A1D22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#29100C;--card:#3E1921;--ink:#EDE1D1;--mut:#b99ea0;--pri:#D98A93;--onpri:#29100C;--line:#5A1D22;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:auto;padding:16px 16px 96px}
h1,h2,.serif{font-family:Fraunces,Georgia,serif;font-weight:600}
h1{font-size:30px;line-height:1.1}h2{font-size:19px;margin:22px 0 10px}
.mut{color:var(--mut);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.hero{background:var(--pri);color:var(--onpri);border:0}.hero .mut{color:var(--onpri);opacity:.8}
.big{font-family:Fraunces,Georgia,serif;font-size:42px;font-weight:600;line-height:1.05}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;border-radius:9px}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{border:0;border-radius:16px;padding:12px 16px;background:var(--card);border:1px solid var(--line);cursor:pointer;min-height:46px}
.btn{display:block;text-align:center;margin-top:8px}
.p{background:var(--pri);color:var(--onpri);border-color:var(--pri);font-weight:700}.p[disabled]{opacity:.35}
button.del{color:var(--warn);border-color:var(--warn)}
.chip{padding:9px 13px;border-radius:99px;min-height:0;margin:0 6px 8px 0;display:inline-block}.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%}
label.fld{display:block;margin:12px 0 4px;font-size:13px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));max-width:480px;margin:auto}
nav button{background:none;border:0;font-size:12px;min-height:50px;padding:4px;color:var(--mut)}nav button b{display:block;font-size:19px;font-weight:400}nav .on{color:var(--pri);font-weight:700}
.sw{touch-action:pan-y;user-select:none;text-align:center;padding:26px 18px;position:relative}
.sw .big{font-size:50px}.hint{position:absolute;top:14px;font-weight:700;opacity:0;font-size:14px}
.sug{margin-top:16px;padding:12px;border-radius:16px;background:var(--bg)}.warn{color:var(--warn);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(41,16,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow:auto}
.sheet h1{font-size:24px}
.tx{padding:11px 0;border-bottom:1px solid var(--line)}.neg{color:var(--warn)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;z-index:9}
.empty{text-align:center;padding:22px 16px}.empty b{display:block;font-size:17px;margin-bottom:4px}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="ov"></div><div id="toast"></div>
<script>
const K='pocketBudget1',$=s=>document.querySelector(s);
const E=['Rent & housing','Groceries','Transport','Healthcare','Uni & study','Subscriptions & phone','Other essentials'];
const D=['Eating out','Coffee shop','Personal care','Clothing','Fitness','Entertainment & hobbies','Gifts & donations','Trips & travel','Other spending'];
const defCats=()=>[...E.map(n=>({n,t:'E'})),...D.map(n=>({n,t:'S'})),...['Job','Side hustle','Other income'].map(n=>({n,t:'I'}))];
const defPots=()=>[['Gym',250],['Health backup',400],['Emergency fund',600],['Architecture / uni',400],['3 months of salary',1800],['Other',450],['Investments',0]].map(([n,g])=>({n,g,s:0,dl:''}));
const def=()=>({tx:[],q:[],rules:{},cats:defCats(),pots:defPots(),adj:[],set:{pay:150,dow:5,save:20,ess:60,spend:20,shift:5},focus:{},mg:{}});
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36).slice(-4);
function migrate(o){o.tx=o.tx||[];o.q=o.q||[];o.rules=o.rules||{};o.adj=o.adj||[];o.focus=o.focus||{};o.mg=o.mg||{};
 o.set=Object.assign({pay:150,dow:5,save:20,ess:60,spend:20,shift:5},o.set||{});o.cats=o.cats||defCats();
 if(o.inc){o.inc.forEach(n=>{if(!o.cats.some(c=>c.t=='I'&&c.n==n))o.cats.push({n,t:'I'})});delete o.inc}
 o.pots=o.pots||defPots();o.pots.forEach(p=>{p.dl=p.dl||'';p.g=+p.g||0;p.s=+p.s||0});o.tx.forEach(t=>{if(!t.id)t.id=uid()});return o}
let S=null,tab='home',sh=null,hf={q:'',m:'this',k:'all',y:'all',c:'all'},skipFocus=false;

/* ---------- storage: IndexedDB first, localStorage as fallback copy ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('pocketBudget',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbGet=async()=>{const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const idbPut=async v=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,'state');t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
let wq=Promise.resolve(),warned=false;
function sv(){wq=wq.then(()=>idbPut(JSON.parse(JSON.stringify(S)))).catch(()=>{if(!warned){warned=true;toast('Could not save in this browser. Download a backup.')}});
 try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
window.__flush=()=>wq;

const eur=n=>new Intl.NumberFormat('nl-BE',{style:'currency',currency:'EUR'}).format(n||0);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),ym=()=>today().slice(0,7);
const fd=s=>new Date(s+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const key=d=>String(d).toUpperCase().replace(/[0-9]+/g,' ').replace(/[^A-Z ]/g,' ').split(/\s+/).filter(w=>w.length>2).slice(0,3).join(' ');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{$('#toast').innerHTML=`<div class=toast>${esc(m)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2600)};
const n2=v=>{const x=parseFloat(String(v).trim().replace(',','.'));return isNaN(x)?NaN:Math.round(x*100)/100};
const ctype=c=>(S.cats.find(x=>x.n==c&&x.t!='I')||{t:'S'}).t;
const sum=(a,f)=>a.reduce((s,t)=>s+f(t),0);
const exists=(k,c)=>k=='expense'?S.cats.some(x=>x.t!='I'&&x.n==c):k=='income'?S.cats.some(x=>x.t=='I'&&x.n==c):k=='saving'?S.pots.some(p=>p.n==c):false;

/* ---------- reading bank files (built in, nothing is uploaded anywhere) ---------- */
const num=v=>{if(typeof v=='number')return v;let s=String(v??'').replace(/[€\s ]/g,'');if(!s)return NaN;const ng=/^\(.*\)$/.test(s)||/-$/.test(s);s=s.replace(/[()]/g,'').replace(/-$/,'');
 if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');
 const n=parseFloat(s);return ng&&n>0?-n:n};
const pdate=v=>{if(typeof v=='number'&&v>20000){return new Date((Math.floor(v)-25569)*864e5).toISOString().slice(0,10)}
 const s=String(v||''),a=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(a)return a[0];const b=s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
 return b?`${b[3]}-${b[2].padStart(2,'0')}-${b[1].padStart(2,'0')}`:null};
function parseCSV(t,d){const rows=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
async function inflate(u8){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u8).catch(()=>{});w.close().catch(()=>{});return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;
 for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--)if(dv.getUint32(i,true)==0x06054b50){e=i;break}
 if(e<0)throw new Error('zip');const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const f={};
 for(let k=0;k<n&&dv.getUint32(p,true)==0x02014b50;k++){const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
  f[new TextDecoder().decode(u.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),lo:dv.getUint32(p+42,true)};p+=46+nl+xl+cl}
 return{names:Object.keys(f),async get(name){const x=f[name];if(!x)return null;const s=x.lo+30+dv.getUint16(x.lo+26,true)+dv.getUint16(x.lo+28,true),d=u.subarray(s,s+x.cs);
  return new TextDecoder().decode(x.m==0?d:await inflate(d))}}}
async function readXlsx(buf){const z=await unzip(buf),P=s=>new DOMParser().parseFromString(s,'application/xml'),T=(el,n)=>[...el.getElementsByTagName(n)];
 const ss=[],sx=await z.get('xl/sharedStrings.xml');if(sx)T(P(sx),'si').forEach(si=>ss.push(T(si,'t').map(t=>t.textContent).join('')));
 let path=null;try{const wbx=P(await z.get('xl/workbook.xml')),rel=P(await z.get('xl/_rels/workbook.xml.rels')),rid=T(wbx,'sheet')[0].getAttribute('r:id'),
  tg=T(rel,'Relationship').find(r=>r.getAttribute('Id')==rid).getAttribute('Target');path=tg.startsWith('/')?tg.slice(1):'xl/'+tg}catch(e){}
 if(!path||!z.names.includes(path))path=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
 const doc=P(await z.get(path)),rows=[],ci=r=>{let n=0;for(const ch of r.replace(/[0-9]/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
 T(doc,'row').forEach((row,ri)=>{const rn=(+row.getAttribute('r')||ri+1)-1,out=[];
  T(row,'c').forEach(c=>{const i=ci(c.getAttribute('r')||''),t=c.getAttribute('t'),v=T(c,'v')[0],raw=v?v.textContent:'';let val;
   if(t=='s')val=ss[+raw]??'';else if(t=='inlineStr')val=T(c,'t').map(x=>x.textContent).join('');else if(t=='str'||t=='e'||t=='d'||t=='b')val=raw;else val=raw===''?'':parseFloat(raw);
   out[i]=val});for(let j=0;j<out.length;j++)if(out[j]===undefined)out[j]='';while(rows.length<rn)rows.push([]);rows[rn]=out});return rows}
async function fileRows(f){const ab=await f.arrayBuffer(),h=new Uint8Array(ab.slice(0,4));
 if(h[0]==0x50&&h[1]==0x4b)return readXlsx(ab);
 if(h[0]==0xD0&&h[1]==0xCF)throw new Error('Old .xls files cannot be read. Save it as .xlsx or CSV and try again.');
 let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(ab)}catch(e){t=new TextDecoder('windows-1252').decode(ab)}
 t=t.replace(/^﻿/,'');const smp=t.slice(0,3000),d=[';',',','\t'].sort((a,b)=>smp.split(b).length-smp.split(a).length)[0];return parseCSV(t,d)}
async function importFile(f){let rows;try{rows=await fileRows(f)}catch(e){return toast(/xls/.test(e.message)?e.message:'Could not read that file.')}
 let h=rows.findIndex((r,i)=>i<20&&r.filter(c=>typeof c=='string'&&c.trim()).length>=3&&r.some(c=>/date|datum|amount|bedrag/i.test(c)));if(h<0)h=0;
 const H=(rows[h]||[]).map(c=>String(c).toLowerCase()),ix=re=>H.map((c,i)=>re.test(c)?i:-1).filter(i=>i>=0);
 const cd=ix(/date|datum|valuta|boek/)[0],cde=ix(/desc|omschr|naam|name|tegenpartij|counterparty|mededeling|payee|detail/).slice(0,2),
 ca=ix(/amount|bedrag|montant/)[0],cdb=ix(/debit|\baf\b|withdraw/)[0],ccr=ix(/credit|\bbij\b|deposit/)[0],cs=ix(/af\/bij|d\/c|cr\/dr|^type/)[0];
 if(cd==null||(ca==null&&cdb==null&&ccr==null))return toast('I could not find date and amount columns.');
 const have=new Set([...S.tx,...S.q].map(t=>t.d+'|'+t.desc+'|'+t.amt));let add=0,skip=0;
 rows.slice(h+1).forEach(r=>{const d=pdate(r[cd]);let a=ca!=null?num(r[ca]):(num(r[ccr])||0)-Math.abs(num(r[cdb])||0);
  if(ca!=null&&cs!=null&&a>0&&/^(af|debit|db|dr|d)\b/i.test(String(r[cs]).trim()))a=-a;
  const desc=cde.map(i=>String(r[i]||'').trim()).filter(Boolean).join(' – ');if(!d||!a||isNaN(a))return;a=Math.round(a*100)/100;
  if(have.has(d+'|'+desc+'|'+a)){skip++;return}have.add(d+'|'+desc+'|'+a);S.q.push({id:uid(),d,desc,amt:a,key:key(desc)});add++});
 S.q.sort((x,y)=>x.d<y.d?-1:1);sv();toast(add?`${add} new to review${skip?`, ${skip} already imported`:''}`:(skip?'Nothing new, all already imported':'No transactions found in that file'));tab='review';sh=null;render()}

/* ---------- learning ---------- */
function sugg(t){let r=S.rules[t.key],sure=true;
 if(!r){const w=t.key.split(' ')[0],o=w&&Object.keys(S.rules).find(k=>k.split(' ')[0]==w);if(o){r=S.rules[o];sure=false}}
 if(r&&r.kind!='transfer'&&!exists(r.kind,r.cat))r=null;if(r)return{...r,sure};
 if(/spaar|saving|sparen/i.test(t.desc))return{kind:'saving',cat:null,sure:false};
 return{kind:t.amt>0?'income':'expense',cat:null,sure:false}}
function commit(t,kind,cat){S.q=S.q.filter(x=>x.id!=t.id);S.tx.push({...t,kind,cat});if(t.key)S.rules[t.key]={kind,cat};sv();sh=null;render()}

/* ---------- numbers ---------- */
function stats(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),dim=new Date(y,m+1,0).getDate(),td=n.getDate(),mt=S.tx.filter(t=>t.d.startsWith(ym())),
 ex=mt.filter(t=>t.kind=='expense'),inc=sum(mt.filter(t=>t.kind=='income'),t=>t.amt),spent=sum(ex,t=>-t.amt),ess=sum(ex.filter(t=>ctype(t.cat)=='E'),t=>-t.amt),
 saved=sum(mt.filter(t=>t.kind=='saving'),t=>-t.amt);let pd=0;for(let d=td+1;d<=dim;d++)if(new Date(y,m,d).getDay()==S.set.dow)pd++;
 const fc=inc+pd*S.set.pay,sh_=({save:1,maint:0,spend:-1}[S.focus[ym()]]||0)*S.set.shift,autoT=fc*(S.set.save+sh_)/100,autoD=fc*(S.set.spend-sh_)/100,mg=S.mg[ym()]||{},
 tgt=mg.save!=null?mg.save:autoT,db=mg.dis!=null?mg.dis:autoD,
 left=fc-spent-Math.max(tgt,saved),dl=dim-td+1,st=sum(ex.filter(t=>t.d==today()),t=>-t.amt),day=(left+st)/dl,
 e=Math.min(dim,td-((n.getDay()+6)%7)+6);
 return{inc,spent,ess,dis:spent-ess,saved,fc,tgt,left,day,today:day-st,week:day*(e-td+1)-st,eb:fc*S.set.ess/100,db,dl,autoT,autoD}}
const potBal=p=>p.s+sum(S.tx.filter(t=>t.kind=='saving'&&t.cat==p.n),t=>-t.amt)+sum(S.adj.filter(a=>a.p==p.n),a=>a.v);

/* ---------- views ---------- */
const bar=(a,b,c)=>`<div class=bar><i style="width:${Math.max(0,Math.min(100,b>0?a/b*100:0))}%;background:${c}"></i></div>`;
const FN={save:'Save more',maint:'Maintenance',spend:'Spend more'};
const pct=(a,b)=>b>0?new Intl.NumberFormat('en-GB',{maximumFractionDigits:1}).format(Math.max(0,a/b*100))+'%':'';
const V={};
V.home=()=>{const s=stats(),f=S.focus[ym()],mn=new Date().toLocaleDateString('en-GB',{month:'long'});
 return `<div class=row><h1>${mn}</h1><button data-a=focus>${f?FN[f]:'Pick focus'} ✎</button></div>
 <div class="card hero" style="margin-top:14px"><div class=mut>Left today</div><div class=big>${eur(s.today)}</div>
 <div class="row mut" style="margin-top:10px"><span>This week ${eur(s.week)}</span><span>This month ${eur(s.left)}</span></div></div>
 <div class=grid><div class=card><div class=mut>Income</div><b>${eur(s.inc)}</b><div class=mut>forecast ${eur(s.fc)}</div></div><div class=card><div class=mut>Spent</div><b>${eur(s.spent)}</b></div>
 <div class=card><div class=mut>Saved</div><b>${eur(s.saved)}</b></div><div class=card><div class=mut>Remaining</div><b class="${s.left<0?'neg':''}">${eur(s.left)}</b><div class=mut>${eur(s.day)} a day</div></div></div>
 <h2>Budget progress</h2><div class=card>
 <div class=row><span>Essential spending</span><span class=mut>${eur(s.ess)} / ${eur(s.eb)}</span></div>${bar(s.ess,s.eb,s.ess>s.eb?'var(--warn)':'var(--blue)')}
 <div class=row style="margin-top:12px"><span>Discretionary spending</span><span class=mut>${eur(s.dis)} / ${eur(s.db)}</span></div>${bar(s.dis,s.db,s.dis>s.db?'var(--warn)':'var(--pri)')}
 <div class=row style="margin-top:12px"><span>Savings</span><span class=mut>${eur(s.saved)} / ${eur(s.tgt)}</span></div>${bar(s.saved,s.tgt,'var(--gold)')}</div>
 <div class=row><h2>Monthly goals</h2><button data-a=mg style="min-height:36px;padding:6px 14px">Edit</button></div><div class=card>
 <div class=row><span>Save ${eur(s.tgt)}</span><b>${s.saved>=s.tgt&&s.tgt>0?'✓ Goal reached':eur(Math.max(0,s.tgt-s.saved))+' to go'}</b></div>
 <div class=row style="margin-top:8px"><span>Discretionary max ${eur(s.db)}</span><b class="${s.dis>s.db?'neg':''}">${s.dis>s.db?'Over by '+eur(s.dis-s.db):'✓ Within budget'}</b></div></div>
 ${S.q.length?`<button class="p" style="width:100%" data-a=tab data-t=review>${S.q.length} to review</button>`:''}`};
V.review=()=>{const t=S.q[0];const imp=`<label class="btn p" style="margin-top:10px">Import bank file<input type=file id=f accept=".csv,.xlsx,.txt,text/csv" hidden></label>`;
 if(!t)return `<h1>Review</h1><div class=card style="margin-top:14px"><p>Nothing waiting. Download your bank spreadsheet (Excel or CSV) and import it here. Every transaction comes to you one at a time.</p>${imp}</div>`;
 const g=sugg(t),ok=g.sure&&(g.cat||g.kind=='transfer'),kn={expense:'Expense',income:'Income',saving:'Savings',transfer:'Own transfer'};
 return `<div class=row><h1>Review</h1><span class=mut>${S.q.length} left</span></div>
 <div class="card sw" id=card style="margin-top:14px"><span class=hint style="left:16px;color:var(--pri)">Edit</span><span class=hint style="right:16px;color:var(--gold)">Correct</span>

/* ---------- render ---------- */
function render(){if(!S)return;if(tab=='home'&&!S.focus[ym()]&&!sh&&!skipFocus)sh={t:'focus'};

 $('#nav').innerHTML=[['home','⌂','Home'],['review','✓','Review'],['activity','☰','History'],['savings','◐','Savings'],['settings','⚙','Settings']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" data-a=tab data-t=${k}><b>${i}</b>${l}${k=='review'&&S.q.length?' ('+S.q.length+')':''}</button>`).join('');
 const q=$('#hq');if(q)q.oninput=()=>{hf.q=q.value;$('#list').innerHTML=list()};
 const c=$('#card');if(c){let x0=null,dx=0;const H=c.querySelectorAll('.hint'),rs=()=>{x0=null;dx=0;c.style.transform='';H.forEach(h=>h.style.opacity=0)};
  c.onpointerdown=e=>{x0=e.clientX;dx=0;c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(x0==null)return;dx=e.clientX-x0;c.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`;H[0].style.opacity=dx<0?Math.min(1,-dx/90):0;H[1].style.opacity=dx>0?Math.min(1,dx/90):0};
  c.onpointerup=()=>{if(x0==null)return;const d=dx;rs();if(Math.abs(d)>90)d>0?act.ok():act.edit()};c.onpointercancel=rs}
 if(sy)scrollTo(0,sy)}

/* ---------- actions ---------- */
const err=m=>{sh.err=m;render()};
function renameCat(o,n,fam){const k=fam=='I'?'income':'expense';S.tx.forEach(x=>{if(x.kind==k&&x.cat==o)x.cat=n});Object.values(S.rules).forEach(r=>{if(r.kind==k&&r.cat==o)r.cat=n})}
function renamePot(o,n){S.tx.forEach(x=>{if(x.kind=='saving'&&x.cat==o)x.cat=n});Object.values(S.rules).forEach(r=>{if(r.kind=='saving'&&r.cat==o)r.cat=n});S.adj.forEach(a=>{if(a.p==o)a.p=n})}
function dropRules(k,c){Object.keys(S.rules).forEach(x=>{const r=S.rules[x];if(r.kind==k&&r.cat==c)delete S.rules[x]})}
const done=(msg)=>{sv();const r=sh&&sh.ret;sh=r||null;render();if(msg)toast(msg)};
const act={tab:d=>{tab=d.t;sh=null;render();scrollTo(0,0)},
 close:()=>{const r=sh&&sh.ret;sh=r||null;skipFocus=true;render()},
 focus:()=>{sh={t:'focus'};render()},setf:d=>{S.focus[ym()]=d.k;sv();sh=null;render()},
 ok:()=>{const t=S.q[0],g=sugg(t);if(g.sure&&(g.cat||g.kind=='transfer'))commit(t,g.kind,g.cat);else act.edit()},
 edit:()=>{const t=S.q[0],g=sugg(t);sh={t:'edit',tx:t,kind:g.kind,cat:g.cat};render()},
 hist:d=>{const t=S.tx.find(x=>x.id==d.i);if(!t)return;sh={t:'edit',tx:t,kind:t.kind,cat:t.cat,hist:1};render()},
 kind:d=>{sh.kind=d.k;sh.cat=null;render()},pick:d=>{sh.cat=d.n;render()},
 saveEd:()=>{const k=sh.kind,c=k=='transfer'?null:sh.cat;if(sh.hist){const t=S.tx.find(x=>x.id==sh.tx.id);t.kind=k;t.cat=c;if(t.key)S.rules[t.key]={kind:k,cat:c};sv();sh=null;render();toast('Saved')}else commit(sh.tx,k,c)},
 txdel:()=>{const t=sh.tx;sh={t:'ask',title:'Delete this transaction?',msg:`${eur(t.amt)} · ${t.desc||''}`,ok:'Delete transaction',fn:()=>{S.tx=S.tx.filter(x=>x.id!=t.id);done('Deleted')}};render()},
 /* savings goals */
 goaladd:()=>{sh={t:'goal',i:null,n:'',g:'',cur:'',dl:'',ret:sh&&sh.t=='edit'?sh:null};render()},
 goaledit:d=>{const p=S.pots[+d.i];sh={t:'goal',i:+d.i,n:p.n,g:p.g?String(p.g):'',cur:String(Math.round(potBal(p)*100)/100),dl:p.dl||''};render()},
 goalsave:()=>{const n=(sh.n||'').trim(),g=sh.g===''?0:n2(sh.g),c=sh.cur===''?0:n2(sh.cur);
  if(!n)return err('Give the goal a name.');if(isNaN(g)||g<0)return err('The target must be a number.');if(isNaN(c))return err('The current amount must be a number.');
  if(S.pots.some((p,j)=>j!==sh.i&&p.n.toLowerCase()==n.toLowerCase()))return err('You already have a goal with that name.');
  if(sh.i==null){S.pots.push({n,g,s:c,dl:sh.dl||''});if(sh.ret){sh.ret.kind='saving';sh.ret.cat=n}}
  else{const p=S.pots[sh.i],b=potBal(p);p.s=Math.round((p.s+c-b)*100)/100;if(p.n!=n){renamePot(p.n,n);p.n=n}p.g=g;p.dl=sh.dl||''}
  done('Goal saved')},
 goaldel:d=>{const p=S.pots[+d.i],b=potBal(p),cnt=S.tx.filter(t=>t.kind=='saving'&&t.cat==p.n).length,opts=S.pots.filter(x=>x!==p).map(x=>x.n);
  sh={t:'ask',title:`Delete “${p.n}”?`,msg:`This goal and its balance (${eur(b)}) leave your total.${cnt?` ${cnt} savings transaction${cnt>1?'s are':' is'} linked to it. Where should ${cnt>1?'they':'it'} go?`:''}`,opts:cnt?opts:null,none:'Leave without a goal',ok:'Delete goal',
  fn:mv=>{S.tx.forEach(t=>{if(t.kind=='saving'&&t.cat==p.n)t.cat=mv||''});if(mv)S.adj.forEach(a=>{if(a.p==p.n)a.p=mv});else S.adj=S.adj.filter(a=>a.p!=p.n);dropRules('saving',p.n);S.pots.splice(S.pots.indexOf(p),1);sh=null;done('Goal deleted')}};render()},
 adj:d=>{sh={t:'adj',i:+d.i,v:''};render()},
 adjok:()=>{const v=n2(sh.v);if(!v)return err('Enter an amount, for example 25 or -40.');S.adj.push({p:S.pots[sh.i].n,v,d:today()});done('Updated')},
 /* categories */
 catadd:()=>{sh={t:'cat',i:null,n:'',ty:'S'};render()},
 newcat:d=>{sh={t:'cat',i:null,n:'',ty:d.ty,ret:sh};render()},
 catedit:d=>{const c=S.cats[+d.i];sh={t:'cat',i:+d.i,n:c.n,ty:c.t};render()},
 catty:d=>{sh.ty=d.k;render()},
 catsave:()=>{const n=(sh.n||'').trim(),ty=sh.ty;if(!n)return err('Give the category a name.');
  if(ty=='V'){if(S.pots.some(p=>p.n.toLowerCase()==n.toLowerCase()))return err('You already have a goal with that name.');S.pots.push({n,g:0,s:0,dl:''});if(sh.ret){sh.ret.kind='saving';sh.ret.cat=n}return done('Savings goal added')}
  const fam=ty=='I'?'I':'X';if(S.cats.some((c,j)=>j!==sh.i&&(c.t=='I')==(fam=='I')&&c.n.toLowerCase()==n.toLowerCase()))return err('You already have a category with that name.');
  if(sh.i==null){S.cats.push({n,t:ty});if(sh.ret){sh.ret.kind=fam=='I'?'income':'expense';sh.ret.cat=n}}else{const c=S.cats[sh.i];if(c.n!=n){renameCat(c.n,n,fam);c.n=n}c.t=ty}
  done('Category saved')},
